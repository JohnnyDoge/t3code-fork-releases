name: Fork desktop release

on:
  schedule:
    - cron: "43 6 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if main is already released
        type: boolean
        default: false

concurrency:
  group: fork-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORK_RELEASE_TAGS_QUERY: >-
    .[] | select(.isPrerelease and .name == ("T3 Code Fork " + .tagName)) |
    .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\.[0-9]+$"))

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.repository == 'JohnnyDoge/t3code-fork-releases' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
      node_version: ${{ steps.release.outputs.node_version }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ vars.FORK_REPOSITORY || 'JohnnyDoge/t3code' }}
          ref: refs/heads/main
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Disabling persisted credentials breaks on the vendored gitlinks under .repos.
      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Plan release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          FORK_REPOSITORY: ${{ vars.FORK_REPOSITORY || 'JohnnyDoge/t3code' }}
        run: |
          source_sha=$(git rev-parse HEAD)
          notes="Desktop build from https://github.com/$FORK_REPOSITORY/commit/$source_sha."
          previous_tags=$(gh release list --exclude-drafts --limit 100 --json tagName,name,isPrerelease \
            --jq "$FORK_RELEASE_TAGS_QUERY" | sort -Vr)
          previous_tag=${previous_tags%%$'\n'*}
          if [[ -n $previous_tag && $FORCE != true ]]; then
            previous_notes=$(gh release view "$previous_tag" --json body --jq .body)
            if [[ $previous_notes == "$notes" ]]; then
              echo "Fork main is already released as $previous_tag."
              exit 0
            fi
          fi

          upstream_tag=$(bash scripts/fork/upstream-base.sh)
          official_tags=$(gh release list --repo pingdotgg/t3code --exclude-drafts --limit 100 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$' | sort -Vr)
          official_tag=${official_tags%%$'\n'*}
          version=$(node scripts/fork/release-version.ts "$upstream_tag" "$(date -u +%Y%m%d)" \
            "$GITHUB_RUN_NUMBER" "$previous_tag" "$official_tag")
          printf 'source_sha=%s\nversion=%s\nnode_version=%s\n' \
            "$source_sha" "$version" "$(node -p 'require("./package.json").engines.node')" >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle and Linux x64 WSL runtime
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout fork source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ vars.FORK_REPOSITORY || 'JohnnyDoge/t3code' }}
          ref: ${{ needs.plan.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # Upstream documents these as the same public client identifiers used by production.
      - name: Build the shared JS bundle with T3 Connect
        run: |
          cp .env.example .env
          node scripts/update-release-package-versions.ts "$VERSION"
          vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          overwrite: true

      - name: Setup Rust for the WSL resource monitor
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux x64 CLI archive for WSL
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/desktop-stage-pnpm/cache
          pnpm_config_store_dir: ${{ runner.temp }}/desktop-stage-pnpm/store
          pnpm_config_prefer_offline: "true"
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1 patchelf
          target=x86_64-unknown-linux-gnu
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$target"
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp "native/resource-monitor/target/$target/release/t3-resource-monitor" "$monitor_dir/"

          node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$VERSION-linux-x64.tar.gz" \
            --expect-version "$VERSION"

      - name: Upload the WSL runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [plan, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-26
            rust_target: aarch64-apple-darwin
            resource_monitor: t3-resource-monitor
          - platform: win
            arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-pc-windows-msvc
            resource_monitor: t3-resource-monitor.exe
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_DESKTOP_SKIP_BUILD: "true"
      T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
      T3CODE_DESKTOP_VERBOSE: "true"
    steps:
      - name: Checkout fork source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ vars.FORK_REPOSITORY || 'JohnnyDoge/t3code' }}
          ref: ${{ needs.plan.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Disabling persisted credentials breaks on the vendored gitlinks under .repos.
      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Verify macOS toolchain
        if: matrix.platform == 'mac'
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk"
          if [[ ${sdk%%.*} -lt 26 ]]; then
            echo "::error::The selected Xcode must provide a macOS 26 or newer SDK."
            exit 1
          fi

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions and load public T3 Connect config
        run: |
          cp .env.example .env
          node scripts/update-release-package-versions.ts "$VERSION"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Cache native resource monitor
        id: resource_monitor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/${{ matrix.resource_monitor }}
          key: fork-resource-monitor-${{ matrix.runner }}-${{ matrix.rust_target }}-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-xwin
        if: matrix.platform == 'win' && steps.resource_monitor.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build native resource monitor
        if: steps.resource_monitor.outputs.cache-hit != 'true'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo ${{ matrix.platform == 'win' && 'xwin build' || 'build' }} --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"

      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: ${{ runner.temp }}/wsl-runtime

      - name: Configure staged production installs
        run: |
          {
            echo "pnpm_config_cache_dir=$RUNNER_TEMP/desktop-stage-pnpm/cache"
            echo "pnpm_config_store_dir=$RUNNER_TEMP/desktop-stage-pnpm/store"
            echo "pnpm_config_prefer_offline=true"
          } >> "$GITHUB_ENV"

      - name: Build and sign macOS desktop artifacts
        if: matrix.platform == 'mac'
        shell: bash
        env:
          FORK_MAC_CERT_P12_BASE64: ${{ secrets.FORK_MAC_CERT_P12_BASE64 }}
          FORK_MAC_CERT_PASSWORD: ${{ secrets.FORK_MAC_CERT_PASSWORD }}
        run: node scripts/fork/build-desktop.ts --platform mac --arch arm64 --version "$VERSION" --out "$RUNNER_TEMP/fork-desktop"

      - name: Cross-build Windows desktop artifacts
        id: windows_build
        if: matrix.platform == 'win'
        shell: bash
        env:
          T3CODE_DESKTOP_KEEP_STAGE: "true"
        run: |
          export T3CODE_DESKTOP_WSL_RUNTIME="$RUNNER_TEMP/wsl-runtime/t3-$VERSION-linux-x64.tar.gz"
          export TMPDIR="$RUNNER_TEMP/fork-windows-stage"
          mkdir -p "$TMPDIR"
          node scripts/fork/build-desktop.ts --platform win --arch x64 --version "$VERSION" --out "$RUNNER_TEMP/fork-desktop"

      - name: List Windows payload files on build failure
        if: failure() && steps.windows_build.outcome == 'failure'
        run: |
          shopt -s nullglob
          for unpacked in "$RUNNER_TEMP"/fork-windows-stage/t3code-desktop-win-stage-*/app/dist/win-unpacked; do
            (cd "$unpacked" && find . -type f | sort)
          done

      - name: Launch macOS app from the DMG
        if: matrix.platform == 'mac'
        run: |
          mount="$RUNNER_TEMP/fork-desktop-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$RUNNER_TEMP/fork-desktop/T3-Code-$VERSION-arm64.dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          apps=("$mount"/*.app)
          app=${apps[0]}
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --executable "$app/Contents/MacOS/$executable" \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"

      - name: Upload launch check output
        if: failure() && matrix.platform == 'mac'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-launch-check-mac-arm64
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore
          overwrite: true

      - name: Stage Windows verification inputs
        if: matrix.platform == 'win'
        run: |
          mkdir verify
          unpacked=("$RUNNER_TEMP"/fork-windows-stage/t3code-desktop-win-stage-*/app/dist/win-unpacked)
          tar -C "$(dirname "${unpacked[0]}")" -cf verify/unpacked.tar win-unpacked
          banner="import{createRequire as __cr}from'node:module';const require=__cr(import.meta.url);"
          scripts/node_modules/.bin/esbuild scripts/verify-windows-desktop-artifact.ts \
            --bundle --platform=node --format=esm --target=node24 --define:import.meta.main=false \
            --banner:js="$banner" --outfile=verify/verify-windows-desktop-artifact.mjs

      - name: Upload Windows verification inputs
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-win-x64
          path: verify/*
          if-no-files-found: error
          compression-level: 1
          overwrite: true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/fork-desktop/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          overwrite: true

  verify_windows:
    name: Verify Windows x64
    needs: [plan, build]
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
          package-manager-cache: false

      - name: Download verification inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-win-x64
          path: verify

      - name: Verify packaged natives
        run: |
          tar -C verify -xf verify/unpacked.tar
          node verify/verify-windows-desktop-artifact.mjs \
            --app-dir "$(cygpath -w "$PWD/verify/win-unpacked")" \
            --arch x64 --build-version "$VERSION" --fork --verbose

      - name: Smoke-test resource monitor
        shell: bash
        env:
          MONITOR: verify/win-unpacked/resources/resource-monitor/t3-resource-monitor.exe
          EXPECTED_ARCH: x86_64
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from "node:child_process";
          const monitor = spawn(process.env.MONITOR, { stdio: ["pipe", "pipe", "inherit"] });
          monitor.stdout.setEncoding("utf8");
          let output = "";
          const exited = new Promise((resolve) => monitor.on("close", resolve));
          const hello = await new Promise((resolve, reject) => {
            monitor.on("error", reject);
            monitor.on("close", () => reject(new Error(`Resource monitor exited before hello: ${output}`)));
            monitor.stdout.on("data", (chunk) => {
              output += chunk;
              const end = output.indexOf("\n");
              if (end !== -1) resolve(JSON.parse(output.slice(0, end)));
            });
          });
          if (hello.type !== "hello" || hello.arch !== process.env.EXPECTED_ARCH) {
            throw new Error(`Unexpected hello: ${JSON.stringify(hello)}`);
          }
          const send = (message) => monitor.stdin.write(`${JSON.stringify({ version: hello.version, ...message })}\n`);
          send({ type: "configure", rootPid: process.pid, sampleIntervalMs: 1000 });
          send({ type: "sampleNow", requestId: "verify" });
          monitor.stdin.end();
          const exitCode = await exited;
          const sample = output
            .split("\n")
            .filter((line) => line.trim())
            .map((line) => JSON.parse(line))
            .find((message) => message.requestId === "verify");
          if (exitCode !== 0 || sample?.type !== "snapshot" || !sample.processes.some((p) => p.pid === process.pid)) {
            throw new Error(`Resource monitor exited ${exitCode} with: ${output}`);
          }
          console.log(`Resource monitor sampled ${sample.scannedProcessCount} processes.`);
          EOF

  publish:
    needs: [plan, build, verify_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout fork release validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ vars.FORK_REPOSITORY || 'JohnnyDoge/t3code' }}
          ref: ${{ needs.plan.outputs.source_sha }}
          sparse-checkout: |
            scripts/fork
            .github/actions

      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-desktop-*
          path: release-assets

      - name: Validate both update manifests
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: ruby scripts/fork/validate-release.rb "$VERSION" release-assets > validated-assets.txt

      - name: Publish validated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.sha }}
          FORK_REPOSITORY: ${{ vars.FORK_REPOSITORY || 'JohnnyDoge/t3code' }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          notes="Desktop build from https://github.com/$FORK_REPOSITORY/commit/$SOURCE_SHA."
          mapfile -t assets < validated-assets.txt
          existing=$(gh release view "$tag" --json name,isDraft,targetCommitish,body \
            --jq '[.name, (.isDraft | tostring), .targetCommitish, .body] | @tsv' \
            2>/dev/null) || existing=
          tag_ref=$(git ls-remote --tags "https://github.com/$GH_REPO.git" "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -z $existing && -n $tag_ref ]]; then
            echo "::error::Release tag $tag already exists without a fork release."
            exit 1
          fi
          if [[ -n $tag_ref && $(tail -n 1 <<< "$tag_ref" | cut -f1) != "$RELEASE_REF" ]]; then
            echo "::error::Release tag $tag points at a different commit."
            exit 1
          fi
          case "$existing" in
            "")
              gh release create "$tag" --draft --prerelease --latest=false --target "$RELEASE_REF" \
                --title "T3 Code Fork $tag" --notes "$notes" "${assets[@]}"
              ;;
            "T3 Code Fork $tag"$'\t'true$'\t'"$RELEASE_REF"$'\t'"$notes")
              gh release upload "$tag" --clobber "${assets[@]}"
              ;;
            *) echo "::error::Release $tag already exists." && exit 1 ;;
          esac
          expected=$(printf '%s\n' "${assets[@]##*/}" | sort)
          uploaded=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ $uploaded != "$expected" ]]; then
            echo "::error::Draft release assets differ from the validated files."
            exit 1
          fi
          gh release edit "$tag" --draft=false --prerelease --latest=false

  update-feed:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.plan.outputs.version == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the nightly update pointer and retain eight releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.sha }}
        run: |
          published=$(gh release list --exclude-drafts --limit 100 --json tagName,name,isPrerelease \
            --jq "$FORK_RELEASE_TAGS_QUERY" | sort -Vru)
          tag=${published%%$'\n'*}
          [[ -n $tag ]] || exit 0
          version=${tag#v}
          mac="T3-Code-$version-arm64"
          win="T3-Code-$version-x64"
          for asset in nightly-mac.yml "$mac.zip" "$mac.zip.blockmap" "$mac.dmg" "$mac.dmg.blockmap" \
                       nightly.yml "$win.exe" "$win.exe.blockmap"; do
            curl --fail --silent --show-error --location --head --output /dev/null \
              --retry 4 --retry-all-errors --max-time 30 "https://github.com/$GH_REPO/releases/download/$tag/$asset"
          done

          gh release view "$tag" --json tagName,name,body --jq '{tag_name: .tagName, name, body}' > nightly.json
          gh release view update-feed > /dev/null 2>&1 ||
            gh release create update-feed --draft --prerelease --latest=false --target "$RELEASE_REF" --title "Update feed" \
              --notes "The desktop updater uses this release to find the newest fork nightly."
          gh release upload update-feed nightly.json --clobber
          gh release edit update-feed --draft=false --prerelease --latest=false

          expired=$(tail -n +9 <<< "$published")
          while IFS= read -r previous; do
            [[ -n $previous ]] || continue
            gh release delete "$previous" --cleanup-tag --yes
          done <<< "$expired"
